---
applications:
  - name: inbound-ewm-agent
    buildpacks:
      - python_buildpack
    instances: 1
    memory: 512M
    disk_quota: 1G
    command: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --chdir app main:application
    env:
      JOULE_RUNTIME: "0"
      AICORE_RESOURCE_GROUP: "default"
      AGENT_LLM_MODEL: "anthropic--claude-4.8-opus"
      AGENT_SUMMARIZATION_MODEL: "anthropic--claude-4.8-opus"
      AGENT_PUBLIC_URL: "https://inbound-ewm-agent.cfapps.us10.hana.ondemand.com/"
      CORS_ALLOW_ORIGINS: "*"
      EWM_ACTIONS_DESTINATION_NAME: "S4H_IDM_400"
      EWM_ACTIONS_SAP_CLIENT: "400"
    services:
      - manu-joule-studio-destination-service
      - aiCore
